services:
  # Base de Datos MySQL 8+
  mysql:
    image: mysql:8.0
    container_name: gestoracad_mysql
    restart: unless-stopped
    command: --log-bin-trust-function-creators=1
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gestoracad_db}
      MYSQL_USER: ${MYSQL_USER:-gestor_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-gestor_secure_pass_2026}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-gestor_root_pass_2026}
      TZ: UTC
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./database/02_security_users_roles_audit.sql:/docker-entrypoint-initdb.d/02_security_users_roles_audit.sql:ro
      - ./database/03_auth_permissions.sql:/docker-entrypoint-initdb.d/03_auth_permissions.sql:ro
      - ./database/04_university_module.sql:/docker-entrypoint-initdb.d/04_university_module.sql:ro
      - ./database/05_teacher_module.sql:/docker-entrypoint-initdb.d/05_teacher_module.sql:ro
      - ./database/06_student_module.sql:/docker-entrypoint-initdb.d/06_student_module.sql:ro
      - ./database/07_db_functions_normalization.sql:/docker-entrypoint-initdb.d/07_db_functions_normalization.sql:ro
      - ./database/08_normalizacion_duplicaciones.sql:/docker-entrypoint-initdb.d/08_normalizacion_duplicaciones.sql:ro
      - ./database/09_catalogo_academico_permisos.sql:/docker-entrypoint-initdb.d/09_catalogo_academico_permisos.sql:ro
      - ./database/10_estructura_academica.sql:/docker-entrypoint-initdb.d/10_estructura_academica.sql:ro
      - ./database/11_estructura_academica_72.sql:/docker-entrypoint-initdb.d/11_estructura_academica_72.sql:ro
      - ./database/12_estructura_academica_73.sql:/docker-entrypoint-initdb.d/12_estructura_academica_73.sql:ro
      - ./database/13_evaluacion_academica.sql:/docker-entrypoint-initdb.d/13_evaluacion_academica.sql:ro
      - ./database/14_portales_estudiante_docente.sql:/docker-entrypoint-initdb.d/14_portales_estudiante_docente.sql:ro
      - ./database/15_asistente_conocimiento.sql:/docker-entrypoint-initdb.d/15_asistente_conocimiento.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-gestor_root_pass_2026}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - gestoracad_network

  # Administrador Web phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: gestoracad_phpmyadmin
    restart: unless-stopped
    ports:
      - "${PHPMYADMIN_PORT:-8085}:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-gestor_root_pass_2026}
      UPLOAD_LIMIT: 64M
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - gestoracad_network

  # Backend REST API (Spring Boot 3.4 / Java 21)
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: gestoracad_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SERVER_PORT: 8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-gestoracad_db}
      DB_USERNAME: ${MYSQL_USER:-gestor_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-gestor_secure_pass_2026}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dGhpc0lzQVZlcnlTZWN1cmVTZWNyZXRLZXlGb3JHYXN0b3JBY2FkZW1pY29WaXJ0dWFsMjAyNg==}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}
      ASSISTANT_MODE: ${ASSISTANT_MODE:-local}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      ASSISTANT_MAX_TOKENS: ${ASSISTANT_MAX_TOKENS:-800}
      ASSISTANT_TEMPERATURE: ${ASSISTANT_TEMPERATURE:-0.2}
      HTTP_CLIENT_CONNECT_TIMEOUT: ${HTTP_CLIENT_CONNECT_TIMEOUT:-5s}
      HTTP_CLIENT_READ_TIMEOUT: ${HTTP_CLIENT_READ_TIMEOUT:-30s}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/api/v1/health/ping || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 35s
    networks:
      - gestoracad_network

  # Frontend Web (React 19 + Vite + Nginx)
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: gestoracad_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - gestoracad_network

volumes:
  mysql_data:
    name: gestoracad_mysql_data

networks:
  gestoracad_network:
    name: gestoracad_network
    driver: bridge
