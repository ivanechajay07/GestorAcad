server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: gestoracad-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:gestoracad_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:rootpassword}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 20000

  # Cliente HTTP saliente (asistente GPT): evita bloqueos por tiempos de espera
  http:
    client:
      connect-timeout: ${HTTP_CLIENT_CONNECT_TIMEOUT:5s}
      read-timeout: ${HTTP_CLIENT_READ_TIMEOUT:30s}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # Migraciones versionadas. En bases existentes se crea una línea base en V1;
  # en una base vacía se aplica V1 desde cero.
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "Esquema base GestorAcad"
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true

# Actuator Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

# JWT Security Config (preparación para Fase 2 y 3)
application:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY:dGhpc0lzQVZlcnlTZWN1cmVTZWNyZXRLZXlGb3JHYXN0b3JBY2FkZW1pY29WaXJ0dWFsMjAyNg==}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}
      refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
      allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
      allowed-headers: "*"
      allow-credentials: true
    rate-limit:
      login:
        max-attempts: ${LOGIN_MAX_ATTEMPTS:10}
        window-seconds: ${LOGIN_WINDOW_SECONDS:60}

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    root: INFO
    com.gestoracad: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN

# Asistente académico: local | gpt/rag
assistant:
  mode: ${ASSISTANT_MODE:local}
  max-tokens: ${ASSISTANT_MAX_TOKENS:800}
  temperature: ${ASSISTANT_TEMPERATURE:0.2}
openai:
  api-key: ${OPENAI_API_KEY:}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
  model: ${OPENAI_MODEL:gpt-4o-mini}
