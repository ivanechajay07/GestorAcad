spring:
  datasource:
    url: jdbc:h2:mem:gestoracad_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

application:
  security:
    jwt:
      secret-key: dGhpc0lzQVRlc3RTZWNyZXRLZXlGb3JHYXN0b3JBY2FkZW1pY29WaXJ0dWFsMjAyNg==
      expiration-ms: 3600000
      refresh-expiration-ms: 86400000
    rate-limit:
      login:
        max-attempts: 1000
        window-seconds: 60

