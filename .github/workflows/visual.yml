name: Visual audit

on:
  workflow_dispatch:

jobs:
  capture:
    name: Capturas visuales
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar backend
        working-directory: backend
        run: mvn -B package -DskipTests

      - name: Configurar Node 20 para build
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Compilar frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Levantar stack
        run: docker compose up -d --build

      - name: Esperar frontend
        run: timeout 240 bash -c 'until curl -sf http://localhost:3000 >/dev/null; do sleep 4; done'

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Capturar pantallas
        env:
          BASE_URL: http://localhost:3000
          CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/visual-capture.mjs

      - name: Publicar capturas
        uses: actions/upload-artifact@v4
        with:
          name: visual-audit
          path: visual-audit/
          retention-days: 14

      - name: Detener stack
        if: always()
        run: docker compose down -v
